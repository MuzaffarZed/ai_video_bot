name: MuzaffarZed AI Video Bot (24/7 Cloud Runner)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: bot-production
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: 📥 Kodni yuklash (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 Python 3.12 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎬 FFmpeg & FFprobe to'liq o'rnatish (Instant 3s Static Binary)
        run: |
          sudo curl -sSL https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-linux-x64 -o /usr/local/bin/ffmpeg
          sudo chmod +x /usr/local/bin/ffmpeg
          sudo curl -sSL https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffprobe-linux-x64 -o /usr/local/bin/ffprobe
          sudo chmod +x /usr/local/bin/ffprobe
          which ffmpeg
          which ffprobe
          ffmpeg -version | head -n 1

      - name: 📦 Python kutubxonalarini o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧠 Kuchli Oflayn AI Dvigatelini O'rnatish (Ollama + Qwen 2.5 7B Flagman)
        run: |
          echo "=== 1. Ollama o'rnatilmoqda ==="
          curl -fsSL https://ollama.com/install.sh | sh
          
          echo "=== 2. Ollama xizmati fonda ishga tushirilmoqda (Keep-Alive 24h) ==="
          export OLLAMA_KEEP_ALIVE="24h"
          ollama serve > /tmp/ollama.log 2>&1 &
          
          echo "=== 3. Ollama xizmati tekshirilmoqda ==="
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null; then
              echo "✅ Ollama server muvaffaqiyatli ishga tushdi ($i s)"
              break
            fi
            sleep 1
          done
          
          echo "=== 4. Flagman Qwen 2.5 7B modeli yuklanmoqda va isitilmoqda (Warmup) ==="
          ollama pull qwen2.5:7b || echo "Ollama pull fallback tayyor"
          ollama run qwen2.5:7b "Salom" > /dev/null 2>&1 || true
          ollama list

      - name: 🤖 Botni Bulutda Ishga Tushirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_HOST: "http://localhost:11434"
          OLLAMA_MODEL: "qwen2.5:7b"
          OLLAMA_KEEP_ALIVE: "24h"
          PYTHONUNBUFFERED: "1"
        run: |
          python bot.py
