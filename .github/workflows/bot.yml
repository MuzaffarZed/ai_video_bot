name: MuzaffarZed AI Video Bot (24/7 Cloud Runner)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: bot-production
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: 📥 Kodni yuklash (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 Python 3.12 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎬 FFmpeg & FFprobe to'liq o'rnatish (Instant 3s Static Binary)
        run: |
          sudo curl -sSL https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-linux-x64 -o /usr/local/bin/ffmpeg
          sudo chmod +x /usr/local/bin/ffmpeg
          sudo curl -sSL https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffprobe-linux-x64 -o /usr/local/bin/ffprobe
          sudo chmod +x /usr/local/bin/ffprobe
          which ffmpeg
          which ffprobe
          ffmpeg -version | head -n 1

      - name: 📦 Python kutubxonalarini o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧠 Kuchli Oflayn AI Dvigatelini O'rnatish (Ollama CLI)
        run: |
          echo "=== Ollama o'rnatilmoqda ==="
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: 🤖 Botni Bulutda Ishga Tushirish (Zero-Downtime Watchdog + Ollama Powerhouse)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_HOST: "http://localhost:11434"
          OLLAMA_MODEL: "qwen2.5:7b"
          OLLAMA_KEEP_ALIVE: "24h"
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== 1. Ollama xizmati fonda ishga tushirilmoqda (Keep-Alive 24h) ==="
          export OLLAMA_KEEP_ALIVE="24h"
          ollama serve > /tmp/ollama.log 2>&1 &

          echo "=== 2. Flagman modelni fonda yuklash boshlandi (Non-Blocking Instant Boot) ==="
          (
            echo "⏳ Ollama API tekshirilmoqda..."
            for i in {1..30}; do
              if curl -s http://localhost:11434/api/tags > /dev/null; then
                echo "✅ Ollama server muvaffaqiyatli ishga tushdi ($i s)"
                echo "📥 Flagman Qwen 2.5 7B modeli fonda yuklanmoqda..."
                ollama pull qwen2.5:7b || echo "Ollama pull fallback tayyor"
                ollama run qwen2.5:7b "Salom" > /dev/null 2>&1 || true
                echo "💎 Flagman Qwen 2.5 7B to'liq xotirada faol!"
                break
              fi
              sleep 1
            done
          ) &

          echo "=== 3. Telegram Bot zudlik bilan ishga tushirilmoqda (Watchdog Loop) ==="
          while true; do
            echo "🚀 [$(date)] MuzaffarZed AI Video Bot ishga tushmoqda..."
            python bot.py || true
            echo "⚠️ [$(date)] Bot jarayoni to'xtadi. 3 soniyadan so'ng qayta ishga tushadi..."
            sleep 3
          done
