name: MuzaffarZed AI Video Bot (24/7 Cloud Runner)

on:
  workflow_dispatch: # GitHub veb-saytida bitta "Run workflow" tugmasi orqali ishga tushirish
  push:
    branches: [ main, master ]
  schedule:
    # Har 5 soatda qayta start oladi (GitHub Actions 6 soatlik limitidan oldin avtomatik uzluksiz aylanish)
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: 📥 Kodni yuklash (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 Python 3.12 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎬 FFmpeg va Shriftlarni o'rnatish (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: 📦 Python kutubxonalarini o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🤖 Botni Bulutda Ishga Tushirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python bot.py
